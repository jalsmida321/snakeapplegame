<!doctype html>
<html lang="en">
<head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>Chinese New Year 2013 Snake Doodle</title>
    <style>
        html,
        body {
            margin: 0;
            min-height: 100%;
            background: #fff;
        }

        body {
            display: grid;
            place-items: start center;
            overflow-x: auto;
        }

        #hplogo {
            position: relative;
            width: 680px;
            height: 220px;
            overflow: hidden;
            outline: none;
            user-select: none;
        }
    </style>
</head>
<body>
    <div id="hplogo" dir="ltr" tabindex="0" aria-label="Chinese New Year 2013 Snake game"></div>
    <script>
        window.google = window.google || {};
        window.google.doodle = window.google.doodle || {};
        window.google.doodle.standalone = 1;
    </script>
    <script src="/src/vendor/google-snake-doodle/snakeyear13.js"></script>
</body>
</html>
